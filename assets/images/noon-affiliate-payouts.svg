<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-label="Affiliate payout cycle cut from 90 days to 30 days, with automated reports to finance and affiliates">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26262a"/>
      <stop offset="1" stop-color="#161618"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd970"/>
      <stop offset="1" stop-color="#ffc55c"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#dots)"/>

  <g font-family="Poppins, 'Segoe UI', Arial, sans-serif">

    <!-- ── Payout cycle bars ───────────────────────────────── -->
    <text x="70" y="96" fill="#9a9a9e" font-size="15" letter-spacing="1.5">PAYOUT CYCLE</text>

    <text x="70" y="146" fill="#9a9a9e" font-size="16">Before</text>
    <rect x="160" y="124" width="480" height="34" rx="6" fill="#4a4a4f"/>
    <text x="656" y="149" fill="#d6d6d6" font-size="22" font-weight="600">90 days</text>

    <text x="70" y="206" fill="#f5f5f5" font-size="16" font-weight="500">After</text>
    <rect x="160" y="184" width="160" height="34" rx="6" fill="url(#gold)"/>
    <text x="336" y="209" fill="#ffd970" font-size="22" font-weight="600">30 days</text>

    <!-- ── Automated flow ──────────────────────────────────── -->
    <g fill="#2b2b2e" stroke="#3a3a3d" stroke-width="1.5">
      <rect x="70"  y="290" width="190" height="110" rx="12"/>
      <rect x="540" y="290" width="190" height="110" rx="12"/>
    </g>
    <rect x="305" y="290" width="190" height="110" rx="12" fill="#ffd970" fill-opacity="0.12" stroke="#cdb45e" stroke-width="1.8"/>

    <!-- icons -->
    <g fill="none" stroke="#ffd970" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <!-- database / SQL -->
      <ellipse cx="400" cy="322" rx="18" ry="6"/>
      <path d="M382 322 V344 C 382 348, 390 351, 400 351 C 410 351, 418 348, 418 344 V322"/>
      <path d="M382 333 C 382 337, 390 340, 400 340 C 410 340, 418 337, 418 333"/>
      <!-- envelope (finance) -->
      <rect x="147" y="314" width="36" height="26" rx="3"/>
      <path d="M147 316 L165 330 L183 316"/>
      <!-- people (affiliates) -->
      <circle cx="627" cy="320" r="6"/>
      <path d="M615 342 C 615 334, 621 330, 627 330 C 633 330, 639 334, 639 342"/>
      <circle cx="647" cy="323" r="5" stroke-opacity="0.6"/>
      <path d="M641 342 C 641 336, 644 333, 647 333 C 652 333, 657 336, 657 342" stroke-opacity="0.6"/>
    </g>

    <g font-size="16" font-weight="500" text-anchor="middle">
      <text x="165" y="374" fill="#f5f5f5">Finance request</text>
      <text x="400" y="374" fill="#ffd970">SQL payouts</text>
      <text x="635" y="374" fill="#f5f5f5">Affiliate reports</text>
    </g>

    <!-- arrows out from the hub -->
    <g stroke="#cdb45e" stroke-width="2" stroke-opacity="0.85">
      <path d="M305 345 H272"/>
      <path d="M495 345 H528"/>
    </g>
    <g fill="#cdb45e">
      <path d="M274 338 L264 345 L274 352 Z"/>
      <path d="M526 338 L536 345 L526 352 Z"/>
    </g>

  </g>
</svg>

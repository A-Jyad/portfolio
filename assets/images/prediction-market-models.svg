<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-label="Three prediction market models with their returns: WNBA moneyline +23.7%, WNBA spread +9.9%, MLB moneyline +8.2%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26262a"/>
      <stop offset="1" stop-color="#161618"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#dots)"/>

  <g font-family="Poppins, 'Segoe UI', Arial, sans-serif">

    <!-- card frames -->
    <g fill="#2b2b2e" stroke="#3a3a3d" stroke-width="1.5">
      <rect x="40"  y="70" width="228" height="360" rx="14"/>
      <rect x="286" y="70" width="228" height="360" rx="14"/>
      <rect x="532" y="70" width="228" height="360" rx="14"/>
    </g>

    <!-- titles -->
    <g fill="#f5f5f5" font-size="19" font-weight="500">
      <text x="62"  y="112">WNBA moneyline</text>
      <text x="308" y="112">WNBA spread</text>
      <text x="554" y="112">MLB moneyline</text>
    </g>

    <!-- returns -->
    <g fill="#ffd970" font-size="44" font-weight="600">
      <text x="60"  y="178">+23.7%</text>
      <text x="306" y="178">+9.9%</text>
      <text x="552" y="178">+8.2%</text>
    </g>
    <g fill="#9a9a9e" font-size="15">
      <text x="62"  y="204">return</text>
      <text x="308" y="204">return</text>
      <text x="554" y="204">return</text>
    </g>

    <!-- season bars, one shared scale: 150px = +47.3% ; baseline y=390 -->
    <!-- WNBA moneyline 2020-2026 -->
    <g>
      <rect x="62"  y="240" width="22" height="150" rx="3" fill="#ffd970" fill-opacity="0.45"/>
      <rect x="88"  y="356" width="22" height="34"  rx="3" fill="#ffd970" fill-opacity="0.45"/>
      <rect x="114" y="351" width="22" height="39"  rx="3" fill="#ffd970" fill-opacity="0.45"/>
      <rect x="140" y="314" width="22" height="76"  rx="3" fill="#ffd970" fill-opacity="0.45"/>
      <rect x="166" y="315" width="22" height="75"  rx="3" fill="#ffd970" fill-opacity="0.45"/>
      <rect x="192" y="303" width="22" height="87"  rx="3" fill="#ffd970"/>
      <rect x="218" y="281" width="22" height="109" rx="3" fill="#ffd970"/>
    </g>
    <!-- WNBA spread 2018-2026 -->
    <g>
      <rect x="308" y="332" width="17" height="58" rx="3" fill="#ffd970" fill-opacity="0.45"/>
      <rect x="329" y="369" width="17" height="21" rx="3" fill="#ffd970" fill-opacity="0.45"/>
      <rect x="350" y="390" width="17" height="14" rx="3" fill="#d9705e"/>
      <rect x="371" y="326" width="17" height="64" rx="3" fill="#ffd970" fill-opacity="0.45"/>
      <rect x="392" y="362" width="17" height="28" rx="3" fill="#ffd970" fill-opacity="0.45"/>
      <rect x="413" y="351" width="17" height="39" rx="3" fill="#ffd970" fill-opacity="0.45"/>
      <rect x="434" y="354" width="17" height="36" rx="3" fill="#ffd970"/>
      <rect x="455" y="366" width="17" height="24" rx="3" fill="#ffd970"/>
      <rect x="476" y="368" width="17" height="22" rx="3" fill="#ffd970"/>
    </g>
    <!-- MLB moneyline 2023-2026 -->
    <g>
      <rect x="554" y="367" width="40" height="23" rx="3" fill="#ffd970" fill-opacity="0.45"/>
      <rect x="600" y="358" width="40" height="32" rx="3" fill="#ffd970" fill-opacity="0.45"/>
      <rect x="646" y="373" width="40" height="17" rx="3" fill="#ffd970"/>
      <rect x="692" y="353" width="40" height="37" rx="3" fill="#ffd970"/>
    </g>

    <!-- baselines -->
    <g stroke="#6f6f74" stroke-width="1.2">
      <path d="M62 390 H246"/>
      <path d="M308 390 H493"/>
      <path d="M554 390 H738"/>
    </g>

  </g>
</svg>

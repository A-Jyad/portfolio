<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-label="Three property inputs feed a model that forecasts NOI with a 95% range">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26262a"/>
      <stop offset="1" stop-color="#161618"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd970" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#ffc55c" stop-opacity="0.10"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#dots)"/>

  <g font-family="Poppins, 'Segoe UI', Arial, sans-serif">

    <!-- ── Inputs ──────────────────────────────────────────── -->
    <g fill="#2b2b2e" stroke="#3a3a3d" stroke-width="1.5">
      <rect x="60" y="120" width="210" height="62" rx="12"/>
      <rect x="60" y="219" width="210" height="62" rx="12"/>
      <rect x="60" y="318" width="210" height="62" rx="12"/>
    </g>
    <g fill="#9a9a9e" font-size="14">
      <text x="84" y="145">Units</text>
      <text x="84" y="244">Avg unit size</text>
      <text x="84" y="343">Year built</text>
    </g>
    <g fill="#f5f5f5" font-size="21" font-weight="500">
      <text x="84" y="170">200</text>
      <text x="84" y="269">900 sq ft</text>
      <text x="84" y="368">2015</text>
    </g>

    <!-- connectors into the chart -->
    <path d="M270 151 H300 V250 M270 250 H300 M270 349 H300 V250 M300 250 H326" fill="none" stroke="#cdb45e" stroke-width="2" stroke-opacity="0.8"/>
    <path d="M324 243 L334 250 L324 257 Z" fill="#cdb45e"/>

    <!-- ── Forecast chart ──────────────────────────────────── -->
    <rect x="344" y="80" width="396" height="340" rx="14" fill="#2b2b2e" stroke="#cdb45e" stroke-width="1.8"/>
    <text x="370" y="120" fill="#ffd970" font-size="20" font-weight="600">NOI</text>
    <text x="418" y="120" fill="#f0e2b8" font-size="15">forecast · 95% range</text>

    <!-- grid -->
    <g stroke="#3a3a3d" stroke-width="1">
      <path d="M370 180 H714 M370 250 H714 M370 320 H714"/>
    </g>
    <path d="M370 390 H714" stroke="#6f6f74" stroke-width="1.2"/>

    <!-- trailing actuals (solid) and forecast with band -->
    <!-- 95% range: a cone that widens from the last actual -->
    <path d="M540 244 C 590 226, 650 186, 714 150 L 714 246 C 650 246, 590 248, 540 244 Z" fill="url(#band)"/>
    <path d="M540 244 C 590 226, 650 186, 714 150" fill="none" stroke="#cdb45e" stroke-width="1.2" stroke-opacity="0.6"/>
    <path d="M540 244 C 590 248, 650 246, 714 246" fill="none" stroke="#cdb45e" stroke-width="1.2" stroke-opacity="0.6"/>
    <polyline points="370,300 398,290 426,296 454,276 482,272 510,258 540,244" fill="none" stroke="#f5f5f5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.85"/>
    <path d="M540 244 C 580 236, 620 226, 660 216 S 700 200, 714 194" fill="none" stroke="#ffd970" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 0"/>
    <circle cx="540" cy="244" r="5" fill="#ffd970"/>
    <path d="M540 150 V390" stroke="#6f6f74" stroke-width="1" stroke-dasharray="4 5"/>

    <g font-size="13" fill="#9a9a9e">
      <text x="370" y="410">trailing 12 months</text>
      <text x="556" y="410">next 12 months</text>
    </g>

  </g>
</svg>
